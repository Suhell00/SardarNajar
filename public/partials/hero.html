  <!-- =========================================================================
       2. Hero Section & Floating Availability Bar
       ========================================================================= -->
  <section class="hero-section" id="hero">
    <div class="container">
      <div class="hero-banner-card">
        <!-- Luxury Hotel Suite Interior Photo as background -->
        <img 
          src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=1600&q=85" 
          alt="Sky Tower Erbil Luxury Suite" 
          class="hero-bg-img" 
        />
        <div class="hero-overlay"></div>

        <div class="hero-content">
          <div class="hero-tag">
            <span class="dot"></span>
            <span data-i18n="heroBadge">ئوتێلی پێنج ئەستێرەی شاهانە لە هەولێر</span>
          </div>
          <h1 class="hero-title" data-i18n="heroHeadline">
            ئەزموونی مانەوەیەکی شاهانە لە سکای تاوەر هەولێر
          </h1>
          <p class="hero-subtitle" data-i18n="heroSubtitle">
            بەرزترین ئاستی ڕازاوەیی و میواندۆستی کوردی لە دڵی هەولێر بە دیمەنی سەرنجڕاکێشی قەڵا و شەقامی گوڵان.
          </p>
        </div>
      </div>

      <!-- Floating Booking / Availability Bar -->
      <div class="floating-booking-wrapper" id="availabilityBar">
        <form class="booking-bar" id="heroAvailabilityForm">
          <!-- Check-in Date -->
          <div class="input-group">
            <label for="checkInDate">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span data-i18n="checkInLabel">بەرواری هاتن</span>
            </label>
            <input type="date" id="checkInDate" class="input-control" />
          </div>

          <!-- Check-out Date -->
          <div class="input-group">
            <label for="checkOutDate">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span data-i18n="checkOutLabel">بەرواری دەرچوون</span>
            </label>
            <input type="date" id="checkOutDate" class="input-control" />
          </div>

          <!-- Room Type Dropdown -->
          <div class="input-group">
            <label for="roomTypeSelect">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span data-i18n="roomTypeLabel">جۆری ژوور</span>
            </label>
            <select id="roomTypeSelect" class="input-control">
              <option value="all" data-i18n="allTypes">سەرجەم جۆرەکان</option>
              <option value="deluxe" data-i18n="deluxeOption">سویتی دێلوکس</option>
              <option value="panoramic" data-i18n="panoramicOption">سویتی پانۆراما</option>
              <option value="presidential" data-i18n="presidentialOption">پێنتهاوسی ڕۆیاڵ</option>
              <option value="executive" data-i18n="executiveOption">سویتی کارگێڕی</option>
              <option value="penthouse" data-i18n="penthouseOption">کراون پێنتهاوس</option>
            </select>
          </div>

          <!-- Guests Count -->
          <div class="input-group">
            <label for="guestsSelect">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span data-i18n="guestsLabel">ژمارەی میوان</span>
            </label>
            <select id="guestsSelect" class="input-control">
              <option value="1">1 Guest</option>
              <option value="2" selected>2 Guests</option>
              <option value="3">3 Guests</option>
              <option value="4">4 Guests</option>
              <option value="6">6+ Guests (Penthouse)</option>
            </select>
          </div>

          <!-- Action Button -->
          <button type="submit" id="checkAvailabilityBtn" class="btn-primary booking-bar-btn">
            <span data-i18n="checkAvailabilityBtn">پشکنینی بەردەستبوون</span>
          </button>
        </form>
      </div>
    </div>
  </section>
